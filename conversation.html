<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话信息展示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f0f0f0;
    }
    .header h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }
    .header .time {
      color: #888;
      font-size: 14px;
    }
    .section {
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #764ba2;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .field {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .field:hover {
      background: #f0f1f3;
      transform: translateX(4px);
    }
    .field .label {
      font-size: 13px;
      color: #666;
      width: 100px;
      flex-shrink: 0;
    }
    .field .value {
      font-size: 15px;
      color: #333;
      font-weight: 500;
      word-break: break-all;
    }
    .field .value.highlight {
      color: #764ba2;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-wecom {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .badge-direct {
      background: #e3f2fd;
      color: #1565c0;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
      font-size: 12px;
      color: #aaa;
    }
    .footer a {
      color: #764ba2;
      text-decoration: none;
    }
    @media (max-width: 480px) {
      .card { padding: 24px; }
      .field { flex-direction: column; align-items: flex-start; gap: 4px; }
      .field .label { width: auto; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>💬 会话信息</h1>
      <div class="time">提取时间：2026-06-12 18:47:35 CST</div>
    </div>

    <div class="section">
      <div class="section-title">📨 消息元数据</div>
      <div class="field">
        <span class="label">消息 ID</span>
        <span class="value highlight">0a5fdefc6d55388e1dea3ca3cdeb9827</span>
      </div>
      <div class="field">
        <span class="label">时间戳</span>
        <span class="value">Fri 2026-06-12 18:47:35 GMT+8</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">👤 发送者信息</div>
      <div class="field">
        <span class="label">用户 ID</span>
        <span class="value highlight">drizztdu</span>
      </div>
      <div class="field">
        <span class="label">显示名称</span>
        <span class="value">drizztdu</span>
      </div>
      <div class="field">
        <span class="label">标签</span>
        <span class="value">drizztdu</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📱 渠道信息</div>
      <div class="field">
        <span class="label">渠道</span>
        <span class="value"><span class="badge badge-wecom">企业微信</span></span>
      </div>
      <div class="field">
        <span class="label">会话 ID</span>
        <span class="value">wecom:T02520013A</span>
      </div>
      <div class="field">
        <span class="label">会话类型</span>
        <span class="value"><span class="badge badge-direct">直接消息</span></span>
      </div>
    </div>

    <div class="footer">
      Generated by 🦞 OpenClaw · <a href="https://dltaixlt.github.io/drizzt-why">drizzt的十万个为什么</a>
    </div>
  </div>
</body>
</html>
